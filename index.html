
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suri'sOrderNow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER PRINCIPAL -->
    <header class="header">

        <div class="header__container">

            <!-- LOGO -->
            <a href="#" class="header__logo">
                <span class="header__logo-white">Suri's</span><span class="header__logo-yellow">OrderNow</span>
            </a>

            <!-- BUSCADOR -->
            <form class="header__search">

                <input
                    type="search"
                    class="header__search-input"
                    placeholder="Buscar restaurantes, platos o cocinas..."
                >

                <button
                    type="submit"
                    class="header__search-button"
                    aria-label="Buscar">

                    <svg viewBox="0 0 24 24" fill="none">
                        <circle cx="10.8" cy="10.8" r="6.8"
                            stroke="currentColor"
                            stroke-width="2.5"/>

                        <path d="M16 16L21 21"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"/>
                    </svg>

                </button>

            </form>

            <!-- ACCIONES -->
            <nav class="header__actions">

                <div class="header__auth">

                    <a href="#" class="header__auth-link">
                        Inicia sesión
                    </a>

                    <span class="header__auth-separator">|</span>

                    <a href="#" class="header__auth-link">
                        Regístrate
                    </a>

                </div>

                <!-- ICONO USUARIO -->
                <a href="#" class="header__icon" aria-label="Mi cuenta">

                    <svg viewBox="0 0 24 24" fill="none">

                        <circle cx="12" cy="7" r="4"
                            stroke="currentColor"
                            stroke-width="1.8"/>

                        <path d="M4 22V20C4 16.7 7 14 10.5 14H13.5C17 14 20 16.7 20 20V22"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"/>

                    </svg>

                </a>

            </nav>

        </div>

    </header>

</body>
</html>
